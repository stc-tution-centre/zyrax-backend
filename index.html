<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyrax Hosting Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center text-yellow-500">Zyrax Bot Hosting Panel</h1>

        <!-- Upload Form Card -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-md mb-8 border border-gray-700">
            <h2 class="text-xl font-semibold mb-4">Deploy New Bot</h2>
            <form id="deployForm" onsubmit="uploadBot(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Bot Name:</label>
                    <input type="text" id="botName" required class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-yellow-500" placeholder="e.g. Siyaa">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Discord Bot Token:</label>
                    <input type="text" id="botToken" required class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-yellow-500" placeholder="Paste your bot token here">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Bot Project (.zip file):</label>
                    <input type="file" id="botZip" accept=".zip" required class="w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-yellow-600 file:text-white hover:file:bg-yellow-700">
                </div>
                <button type="submit" id="deployBtn" class="w-full bg-yellow-600 hover:bg-yellow-700 font-bold p-2 rounded transition duration-200">Deploy Bot</button>
            </form>
        </div>

        <!-- Active Bots Section -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-md border border-gray-700">
            <h2 class="text-xl font-semibold mb-4">Hosted Projects</h2>
            <div id="projectsList" class="space-y-3">
                <p class="text-gray-400 text-sm">Active bots will appear here after deployment.</p>
            </div>
        </div>
    </div>

    <!-- Update Modal -->
    <div id="updateModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4">
        <div class="bg-gray-800 p-6 rounded-lg w-full max-w-md border border-gray-700">
            <h3 class="text-xl font-bold mb-4">Update Bot: <span id="updateBotNameTitle" class="text-yellow-500"></span></h3>
            <input type="hidden" id="modalBotName">
            
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">New Token (Optional):</label>
                <input type="text" id="updateTokenInput" class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-yellow-500" placeholder="Leave blank to keep old token">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium mb-1">New Project Zip (Optional):</label>
                <input type="file" id="updateZipInput" accept=".zip" class="w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-yellow-600 file:text-white hover:file:bg-yellow-700">
            </div>
            
            <div class="flex justify-end space-x-3">
                <button onclick="closeUpdateModal()" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-sm font-medium">Cancel</button>
                <button onclick="submitUpdateBot()" id="updateSubmitBtn" class="bg-yellow-600 hover:bg-yellow-700 px-4 py-2 rounded text-sm font-bold">Save & Restart</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://zyrax-backend.onrender.com';

        async function uploadBot(event) {
            event.preventDefault();
            const botName = document.getElementById('botName').value.trim();
            const token = document.getElementById('botToken').value.trim();
            const botZip = document.getElementById('botZip').files[0];
            const btn = document.getElementById('deployBtn');

            const formData = new FormData();
            formData.append('botName', botName);
            formData.append('token', token);
            formData.append('botZip', botZip);

            btn.innerText = "Deploying...";
            btn.disabled = true;

            try {
                const response = await fetch(`${BACKEND_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                alert(result.message);
                if (result.success) {
                    document.getElementById('deployForm').reset();
                    addProjectCard(botName);
                }
            } catch (err) {
                alert('Deployment failed: ' + err.message);
            } finally {
                btn.innerText = "Deploy Bot";
                btn.disabled = false;
            }
        }

        function addProjectCard(botName) {
            const list = document.getElementById('projectsList');
            // Remove default empty text if present
            if (list.innerHTML.includes('Active bots will appear')) {
                list.innerHTML = '';
            }

            const card = document.createElement('div');
            card.className = "flex items-center justify-between bg-gray-700 p-4 rounded border border-gray-600";
            card.id = `project-${botName}`;
            card.innerHTML = `
                <div>
                    <h3 class="font-bold text-lg text-yellow-400">${botName}</h3>
                    <span class="text-xs text-green-400 font-semibold">● Status: Running</span>
                </div>
                <div class="space-x-2">
                    <button onclick="openUpdateModal('${botName}')" class="bg-yellow-600 hover:bg-yellow-700 text-white px-3 py-1.5 rounded text-sm font-medium">Update</button>
                    <button onclick="deleteBot('${botName}')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm font-medium">Delete</button>
                </div>
            `;
            list.appendChild(card);
        }

        function openUpdateModal(botName) {
            document.getElementById('modalBotName').value = botName;
            document.getElementById('updateBotNameTitleinnerText' || 'updateBotNameTitle').innerText = botName;
            document.getElementById('updateModal').classList.remove('hidden');
        }

        function closeUpdateModal() {
            document.getElementById('updateModal').classList.add('hidden');
            document.getElementById('updateTokenInput').value = '';
            document.getElementById('updateZipInput').value = '';
        }

        async function submitUpdateBot() {
            const botName = document.getElementById('modalBotName').value;
            const newToken = document.getElementById('updateTokenInput').value.trim();
            const newZip = document.getElementById('updateZipInput').files[0];
            const btn = document.getElementById('updateSubmitBtn');

            const formData = new FormData();
            formData.append('botName', botName);
            if (newToken) formData.append('token', newToken);
            if (newZip) formData.append('botZip', newZip);

            btn.innerText = "Updating...";
            btn.disabled = true;

            try {
                const response = await fetch(`${BACKEND_URL}/update`, {
                    method: 'PUT',
                    body: formData
                });
                const result = await response.json();
                alert(result.message);
                if (result.success) {
                    closeUpdateModal();
                }
            } catch (err) {
                alert('Update failed: ' + err.message);
            } finally {
                btn.innerText = "Save & Restart";
                btn.disabled = false;
            }
        }

        async function deleteBot(botName) {
            if (!confirm(`Are you sure you want to delete ${botName}?`)) return;
            // Aapka delete logic yahan aayega (agar route banaya ho)
            const card = document.getElementById(`project-${botName}`);
            if (card) card.remove();
            alert(`Bot '${botName}' removed from list.`);
        }
    </script>
</body>
</html>
